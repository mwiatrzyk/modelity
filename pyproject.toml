[project]
name = "modelity"
version = "0.38.0"
description = "Domain-oriented validation engine for structured Python models."
authors = [
    { name = "Maciej Wiatrzyk", email = "maciej.wiatrzyk@gmail.com" }
]
license = "MIT"
license-files = ["LICENSE.txt"]
readme = "README.md"
keywords = ["parsing", "validation", "modelling", "parser", "validator", "model", "library", "toolkit"]
classifiers = [
    "Development Status :: 4 - Beta",
    #"Development Status :: 5 - Production/Stable"  <- Use this for first 1.x version
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Libraries",
]
requires-python = ">=3.10"
dependencies = [
    "typing-extensions>=4.16.0",
]

[project.urls]
Homepage = "https://github.com/mwiatrzyk/modelity"
repository = "https://github.com/mwiatrzyk/modelity"
Documentation = "https://modelity.readthedocs.io"

[dependency-groups]
dev = [
    "invoke>=3.0.3",
    "mockify>=0.14.0",
    "mypy>=1.19.1",
    "pytest>=8.4.2",
    "pytest-cov>=7.1.0",
    "pytest-profiling>=1.8.1",
    "ruff>=0.16.6",
    "sphinx>=7.4.7",
    "sphinx-rtd-theme>=3.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["modelity"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.mypy]
python_version = "3.10"
